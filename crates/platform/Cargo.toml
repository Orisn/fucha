[package]
name = "mdm-platform"
description = "Mister Download Manager's operating-system layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mdm-ipc.workspace = true
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

# Marking a downloaded file (macOS' quarantine, Linux's origin attributes).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Sign-in secrets in the login keychain (keychain.rs, #44); already in the tree through
# rustls's platform verifier.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[lints]
workspace = true
