[package]
name = "fucha"
version = "0.1.0"
description = "Fucha — the Star Raft, a modern download manager UI"
authors = ["Dylan"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fucha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The core thread answers async Tauri commands through a oneshot channel.
tokio = { version = "1", features = ["rt", "sync"] }
# The download core, its command channel and its engine, in process.
mdm-core.workspace = true
mdm-ipc.workspace = true
mdm-engine.workspace = true
url.workspace = true
chrono.workspace = true
opener = { version = "0.9.0", features = ["reveal"] }
rfd = "0.18.0"
dirs = "7.0.0"

[lints]
workspace = true
